# How loud running water sounds on the Ambient volume slider.
waterAmbience=1.0

# 0 disables bubbles, 1 shows stationary bubbles, and 2 shows drifting bubbles.
streamBubbles=0
partnerParticles=true
waterfallFoam=3
streamDebris=false
particleSize=1.0
particleDensity=0.25
maxStreamParticlesPerTick=128

# A radius of 0 limits spray to nearby falls.
streamParticleScanRadius=0
particlesOnVanillaWater=false

loadingNotice=true
