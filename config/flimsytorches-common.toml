#Torch Burn Duration
[torch_duration]
	#Age required before torch degrades. A value of 5 lasts approximately 17 minutes on average. 0 = Infinite
	#Flimsy Torch Age (Default: 5)
	# Default: 5
	# Range: 0 ~ 15
	flimsyTorchAge = 15
	#Used Torch Age (Default: 5)
	# Default: 5
	# Range: 0 ~ 15
	usedTorchAge = 15
	#Smoldering Torch Age (Default: 5)
	# Default: 5
	# Range: 0 ~ 15
	smolderingTorchAge = 15

#Lantern Duration Multiplier
[lantern_multiplier]
	#Multiplier affecting the burn duration of torches placed in lanterns. A value of 1.5 extends the lifetime by 50%. 0 = Infinite
	#Lantern Age Multiplier (Default: 1.5)
	# Default: 1.5
	# Range: 0.0 ~ 100.0
	lanternDurationMultiplier = 5.0

#Other Torches
[other_torches]
	#List of torches from other mods to be replaced by flimsy torches if generated.
	#Ground torches to be replaced
	otherGroundTorches = ["aether:ambrosium_torch", "caverns_and_chasms:cupric_torch", "chipped:acacia_torch", "chipped:birch_torch", "chipped:crimson_torch", "chipped:dark_oak_torch", "chipped:glow_torch", "chipped:iron_torch", "chipped:jungle_torch", "chipped:spruce_torch", "chipped:warped_torch", "mynethersdelight:powdery_torch"]
	#Wall torches to be replaced
	otherWallTorches = ["aether:ambrosium_wall_torch", "caverns_and_chasms:cupric_wall_torch", "chipped:acacia_wall_torch", "chipped:birch_wall_torch", "chipped:crimson_wall_torch", "chipped:dark_oak_wall_torch", "chipped:glow_wall_torch", "chipped:iron_wall_torch", "chipped:jungle_wall_torch", "chipped:spruce_wall_torch", "chipped:warped_wall_torch", "mynethersdelight:wall_powdery_torch"]

#General Settings
[general]
	#Chance of a generated torch to remain a regular, non-flimsy torch. A value of 0.01 equals 1%.
	#Setting this to 0 or 1 bypasses random checks, slightly improving performance.
	#Chance Lucky Torch (Default: 0.01)
	# Default: 0.01
	# Range: 0.0 ~ 1.0
	chanceLuckyTorch = 0.01

#Villager Torch Behavior
[villager_torch_behavior]
	#Interval between each attempt to replace a torch. A value of 20 equals 1 second.
	#Torch Replace Interval. (Default: 100)
	# Default: 100
	# Range: > 1
	torchReplaceInterval = 100
	#Defines which torch types villagers are allowed to replace. Lower condition torches are prioritized first.
	#Allow villagers to replace Burnt Out torches
	allowBurntOutReplacement = true
	#Allow villagers to replace Smoldering Torches
	allowSmolderingReplacement = true
	#Allow villagers to replace Used Torches
	allowUsedReplacement = false
