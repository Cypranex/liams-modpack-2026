[storm_damage]
	#How fast hail wears a sail that is set under it, against how fast it was made to. Furled sails and sails under a roof take none. 0 and hail leaves sails alone.
	# Default: 1.0
	# Range: 0.0 ~ 5.0
	hailSailWear = 1.0
	#Hard mode: a strong gale, a hurricane or a tornado tears the outer blocks off a ship, and seas breaking over her deck smash what stands on it, weakest first (glass, wool, fences and doors, then planks, in the worst storms stone). Over a long storm that can hole her and sink her. Chests, machines and anything that stands through events are spared. Needs the mobGriefing game rule.
	stormsBreakShips = false
	#How much a storm breaks a ship when that is on, against how much it was made to: blocks a second.
	# Default: 1.0
	# Range: 0.1 ~ 5.0
	stormShipDamage = 1.0

[altitude]
	#How much colder the air gets for every hundred blocks of height [degrees C]. 8.5 as made: freezing some two hundred blocks over a temperate sea. Lower for a world with very tall terrain (2 keeps a plain at y 500 mild); 0 and height makes no difference.
	# Default: 8.5
	# Range: 0.0 ~ 50.0
	altitudeCoolingPer100Blocks = 8.5
	#Blocks over the sea below which height does not cool the air at all. Set it to where a tall world's ordinary ground lies, and only its mountains are colder.
	# Default: 0.0
	# Range: 0.0 ~ 4000.0
	altitudeCoolingStartsAt = 0.0
	#The most that height ever cools the air by [degrees C], however high. 300 is as good as no limit; 20 keeps the highest peak no more than twenty degrees colder than the sea.
	# Default: 300.0
	# Range: 0.0 ~ 300.0
	altitudeCoolingMost = 300.0

[dimensions]
	#The air of other dimensions, for worlds that aren't the Overworld's kind of place: a moon with no air, a planet whose thin air blows fast and pushes at nothing. Entries are parted by semicolons, each 'dimension = key:value, key:value', and a * in the dimension's name stands for anything. Keys: air (none, thin, thick or normal: a ready-made set), wind_speed and wind_force (times the Overworld's; the force is how hard a wind of the same speed pushes), weather and seasons (true or false), temperature (a fixed reading, degrees C) and temperature_offset. For example 'mymod:moon = air:none; mymod:*_orbit = air:none; mymod:mars = wind_speed:1.6, wind_force:0.017, weather:false'. Data packs can say the same in data/<namespace>/aeronauticswinds/dimension_air/<name>.json, which is how the mod knows Create: Northstar's and Ad Astra's worlds already; what is written here wins. '/atmospherics info' tells what is in force where you stand.
	dimensionAir = ""

[masts]
	#A mast carrying more sail than it will stand in the wind there is creaks, its crew is warned, and held there it breaks a third of the way up and everything above comes down. A thicker mast (2x2, 3x3) and stays and shrouds led from it to each quarter bear far more. Off, no mast ever breaks.
	mastsCanSnap = false
	#How much every mast will stand, against how much it was made to. 2 and a mast bears twice the sail in the same wind; 0.5 half.
	# Default: 1.0
	# Range: 0.1 ~ 20.0
	mastStrength = 1.0
	#Seconds a mast stands twice the load it can bear before it breaks. A tenth over takes ten times as long, so a gust is no danger and a held overload is.
	# Default: 6.0
	# Range: 1.0 ~ 120.0
	mastSnapSeconds = 6.0

[ship_handling]
	#How fast an anchor's chain runs out and comes in, against how fast it was made to: let go, cranked by hand and wound by a shaft alike.
	# Default: 1.0
	# Range: 0.25 ~ 4.0
	anchorChainSpeed = 1.0
	#How hard a dug-in anchor holds a ship, against how hard it was made to. Lower and a gale drags her anchor sooner; higher and she rides out more on less chain.
	# Default: 1.0
	# Range: 0.25 ~ 4.0
	anchorHoldStrength = 1.0
	#How fast the sea comes in through an opening below a hull's waterline, against how fast it was made to. 0 and a holed hull never floods.
	# Default: 1.0
	# Range: 0.0 ~ 4.0
	hullFloodRate = 1.0
	#How fast a flooded hull empties once her openings are out of the water or stopped, against how fast it was made to.
	# Default: 1.0
	# Range: 0.0 ~ 8.0
	hullBailRate = 1.0
	#How fast ballast tanks fill and empty, against how fast they were made to.
	# Default: 1.0
	# Range: 0.25 ~ 4.0
	ballastFlowRate = 1.0
	#How hard the water checks a ship that is being thrown over fast (the brake that stops a hull flipping end over end off a wave). 0 leaves her to tumble; higher is steadier and less lively.
	# Default: 1.0
	# Range: 0.0 ~ 3.0
	capsizeBrake = 1.0
	#How hard the water checks a hull bobbing up and down, against how hard it was made to. Lower and she bounces on a sea; higher and she sits heavy in it.
	# Default: 1.0
	# Range: 0.25 ~ 3.0
	heaveDamping = 1.0
