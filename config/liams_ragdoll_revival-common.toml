#Ticks until a downed player dies (20 ticks = 1 second).
# Default: 1200
# Range: 20 ~ 72000
bleedoutTicks = 2400
#Ticks of continuous Shift + right click needed to revive.
# Default: 60
# Range: 1 ~ 1200
reviveHoldTicks = 60
#Bleedout ticks lost per point of additional damage while downed. Set to 0 to ignore ordinary damage.
# Default: 20
# Range: 0 ~ 1200
damagePenaltyTicksPerPoint = 20
#Health points restored on revival, capped at the player's maximum health.
# Default: 6
# Range: 1 ~ 100
reviveHealth = 6
