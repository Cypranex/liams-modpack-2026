#One trigger per blocked fire hit, at most once per 20 ticks.
[fireward]
	#Maximum durability. Applies to existing rings when carried or equipped. Lowering this can break already worn rings.
	# Default: 256
	# Range: 1 ~ 1000000
	durability = 256
	#Durability lost per trigger. 0 disables wear. Unbreaking does not reduce this cost.
	# Default: 1
	# Range: 0 ~ 1000000
	drainPerTrigger = 1

